<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <title>You're Offline — SusuFlow</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(160deg, #ecfdf5 0%, #f8fafc 55%, #ecfdf5 100%);
        color: #0f172a;
        padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
        text-align: center;
      }
      .card {
        max-width: 380px;
        width: 100%;
      }
      .mark {
        width: 76px;
        height: 76px;
        margin: 0 auto 24px;
        border-radius: 22px;
        background: linear-gradient(135deg, #34d399, #059669);
        display: grid;
        place-items: center;
        box-shadow: 0 18px 40px rgba(5, 150, 105, 0.28);
      }
      .mark svg {
        width: 40px;
        height: 40px;
        color: #022c22;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 10px;
      }
      p {
        color: #475569;
        font-size: 0.95rem;
        line-height: 1.65;
        margin: 0 0 8px;
      }
      .hint {
        color: #64748b;
        font-size: 0.85rem;
      }
      button {
        margin-top: 24px;
        appearance: none;
        border: 0;
        cursor: pointer;
        border-radius: 14px;
        background: #059669;
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 14px 22px;
        box-shadow: 0 12px 24px rgba(5, 150, 105, 0.24);
      }
      button:hover {
        background: #047857;
      }
      .shield {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 18px;
        font-size: 0.75rem;
        color: #059669;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4" />
          <path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4" />
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <p>SusuFlow needs a connection to show your circles and financial activity safely.</p>
      <p class="hint">Your data is protected &mdash; financial and account details are never stored on this device.</p>
      <button onclick="window.location.reload()">Try again</button>
      <div class="shield">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
        </svg>
        0% interest &bull; 100% transparent
      </div>
    </div>
  </body>
</html>
