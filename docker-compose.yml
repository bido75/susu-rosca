services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: susuflow
      POSTGRES_PASSWORD: susuflow
      POSTGRES_DB: susuflow
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susuflow"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
volumes:
  pgdata:
