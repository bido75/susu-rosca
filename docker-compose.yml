services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: susuflow
      POSTGRES_PASSWORD: susuflow
      POSTGRES_DB: susuflow
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susuflow"]
      interval: 5s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "127.0.0.1:3210:3000"
    volumes:
      - "evidence:/app/data/evidence"
    environment:
      DATABASE_URL: postgresql://susuflow:susuflow@db:5432/susuflow?schema=public
      APP_URL: http://127.0.0.1:3210
      EVIDENCE_DIR: /app/data/evidence
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_USER: susuflow
      SMTP_PASSWORD: susuflow
      SMTP_FROM: "SusuFlow <no-reply@example.com>"
      COOKIE_SECURE: "false"

  backups:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: susuflow
      POSTGRES_USER: susuflow
      POSTGRES_PASSWORD: susuflow
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
    volumes:
      - "backups:/backups"

volumes:
  pgdata:
  evidence:
  backups:
