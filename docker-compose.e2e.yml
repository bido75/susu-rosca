name: susuflow-e2e

services:
  db-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: susuflow
      POSTGRES_PASSWORD: susuflow
      POSTGRES_DB: susuflow_e2e
    ports: ["127.0.0.1:5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susuflow -d susuflow_e2e"]
      interval: 3s
      retries: 20
