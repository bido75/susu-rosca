name: susuflow-test

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: susuflow
      POSTGRES_PASSWORD: susuflow
      POSTGRES_DB: susuflow_test
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susuflow -d susuflow_test"]
      interval: 3s
      retries: 20
